[project]
name = "relay-ingest"
version = "0.1.0"
description = "Webhook ingest API that writes events and their outbox rows in one transaction."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "psycopg[binary,pool]>=3.3",
  "pydantic-settings>=2.16",
]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
