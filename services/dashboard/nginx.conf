server {
  listen 80;
  root /usr/share/nginx/html;

  # The API, including its live stream, sits behind the same origin.
  location /v1/ {
    proxy_pass http://ingest:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;       # deliver each server-sent event as it is written
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
