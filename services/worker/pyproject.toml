[project]
name = "relay-worker"
version = "0.1.0"
description = "Kafka workers that apply each event once, retry failures on delay topics and park the rest in a dead-letter topic."
requires-python = ">=3.13"
dependencies = [
  "confluent-kafka>=2.16",
  "psycopg[binary,pool]>=3.3",
  "pydantic-settings>=2.16",
]

[project.scripts]
relay-worker = "worker.main:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
