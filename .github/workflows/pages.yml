name: Deploy the dashboard replay to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["services/dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Free hosts can't run Kafka, so the public page replays a recorded run (public/replay.json).
      - run: npm run build
        env:
          VITE_REPLAY: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: services/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
